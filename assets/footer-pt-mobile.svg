<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 0 480 120" role="img" aria-label="Aprendendo em público, um commit de cada vez.">
<title>Aprendendo em público, um commit de cada vez.</title>
<style>.cur{animation:blink 1.1s steps(1) 5}@keyframes blink{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#1E293B"/>
  </pattern>
  <radialGradient id="glow" cx="50%" cy="100%" r="75%">
    <stop offset="0" stop-color="#38BDF8" stop-opacity=".16"/>
    <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="480" height="120" rx="20" fill="#0F172A"/>
<rect width="480" height="120" rx="20" fill="url(#dots)"/>
<rect width="480" height="120" rx="20" fill="url(#glow)"/>
<rect x=".75" y=".75" width="478.5" height="118.5" rx="19.5" fill="none" stroke="#334155" stroke-width="1.5"/>
<text x="240.0" y="52" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="30" font-weight="700" fill="#38BDF8">‹/›</text>
<text x="33.0" y="92" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="15" fill="#94A3B8" xml:space="preserve" textLength="414.0" lengthAdjust="spacing">Aprendendo em público, um commit de cada vez.<tspan class="cur" fill="#38BDF8">_</tspan></text>
</svg>
