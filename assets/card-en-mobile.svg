<svg xmlns="http://www.w3.org/2000/svg" width="480" height="392" viewBox="0 0 480 392" role="img" aria-label="Profile card: hi, I'm Luiz. Developer, future engineer and student.">
<title>Profile card: hi, I'm Luiz. Developer, future engineer and student.</title>
<style>
.rise{animation:rise .8s ease-out .1s backwards}
.line{transform-box:fill-box;transform-origin:center;animation:grow .7s ease-out .5s backwards}
.ch{animation:show .01s steps(1) backwards}
.cur{animation:appear .01s steps(1) backwards,blink 1.1s steps(1) 5}
.fade{animation:rise .8s ease-out 2.6s backwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes show{from{fill-opacity:0}}
@keyframes appear{from{fill-opacity:0}}
@keyframes blink{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}

.tw{animation:twinkle 10s ease-in-out infinite}
@keyframes twinkle{0%,60%,100%{opacity:1}80%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#1E293B"/></pattern>
  <radialGradient id="glow" cx="75%" cy="45%" r="55%"><stop offset="0" stop-color="#38BDF8" stop-opacity=".16"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
</defs>
<rect width="480" height="392" rx="24" fill="#0F172A"/>
<rect width="480" height="392" rx="24" fill="url(#dots)"/>
<rect width="480" height="392" rx="24" fill="url(#glow)"/>
<rect x=".75" y=".75" width="478.5" height="390.5" rx="23.5" fill="none" stroke="#334155" stroke-width="1.5"/>
<circle cx="28" cy="26" r="6" fill="#38BDF8"/><circle cx="48" cy="26" r="6" fill="#818CF8"/><circle cx="68" cy="26" r="6" fill="#34D399"/>
<line x1="24" y1="50" x2="456" y2="50" stroke="#334155" stroke-width="1.5"/>
<text x="28" y="88" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="11" letter-spacing="3" fill="#38BDF8" font-weight="700">DEV LOG // WORK IN PROGRESS</text>
<text class="rise" x="28" y="130" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#E2E8F0" textLength="195" lengthAdjust="spacing">hi, I'm <tspan fill="#38BDF8">Luiz</tspan>!</text>
<text x="28" y="158" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#94A3B8" textLength="280" lengthAdjust="spacing">Eubastosdev · aspiring full-stack developer</text>
<text x="28" y="194" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#E2E8F0" textLength="283" lengthAdjust="spacing">building, breaking and learning.</text>
<text x="28" y="218" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94A3B8" textLength="259" lengthAdjust="spacing">React, Python and projects that ship.</text>
