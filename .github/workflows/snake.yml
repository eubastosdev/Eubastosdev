name: Generate snake animation

on:
  schedule: # a cada 12 horas (minuto 0)
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

# Sem permissões por padrão; o job pede só o que precisa.
permissions: {}

jobs:
  generate:
    permissions:
      contents: write # necessário para publicar na branch snake-output
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Actions de terceiros fixadas por SHA (o comentário indica a versão).
      - name: generate snake.svg
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/snake.svg?palette=github-dark

      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@c0d7ff0487ee0415efb7f32dab10ea880330b1dd # v3.1.0
        with:
          target_branch: snake-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
