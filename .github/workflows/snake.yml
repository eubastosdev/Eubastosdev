name: Generate snake animation

on:
  schedule: # a cada 12 horas (minuto 0)
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

# Sem permissões por padrão; o job pede só o que precisa.
permissions: {}

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write # necessário para commitar assets/snake.svg no main
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Actions de terceiros fixadas por SHA (o comentário indica a versão).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main

      - name: generate snake.svg
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/snake.svg?palette=github-dark

      # O arquivo vai para o próprio repositório (assets/snake.svg), sem depender
      # de uma branch "-output" separada. Commits do GITHUB_TOKEN não disparam
      # este workflow de novo.
      - name: validate and commit assets/snake.svg
        run: |
          test -s dist/snake.svg && grep -q '<svg' dist/snake.svg
          mkdir -p assets
          cp dist/snake.svg assets/snake.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg
          if git diff --cached --quiet; then
            echo "snake.svg sem mudanças"
          else
            git commit -m "chore: atualiza snake.svg"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
